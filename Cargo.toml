[package]
name = "lethe"
version = "0.1.0"
edition = "2024"
description = "Never forget your NixOS deployments"
license = "EUPL-1.2"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
clap_complete = "4.6.8"
directories = "6.0.0"
dix = { version = "2.2.0", default-features = false }
size = "0.5.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
tabled = "0.21.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yansi = { version = "1.0.1", features = ["detect-env", "detect-tty"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
all = "warn"
pedantic = "warn"
unreadable_literal = { level = "allow", priority = 1 }
