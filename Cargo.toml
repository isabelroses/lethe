[package]
name = "lethe"
version = "0.2.0"
edition = "2024"
description = "Never forget your NixOS deployments"
license = "EUPL-1.2"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
directories = "6.0.0"
dix = { version = "3.0.0", default-features = false, features = ["store"] }
hostname = "0.4"
rusqlite = { version = "0.40", default-features = false, features = [
  "bundled",
  "cache",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tabled = { version = "0.22.0", default-features = false, features = ["std"] }
tiny_http = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.2", features = ["v7"] }
yansi = { version = "1.0.1", features = ["detect-env", "detect-tty"] }
zstd = "0.13.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
all = "warn"
pedantic = "warn"
unreadable_literal = { level = "allow", priority = 1 }
